[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusedkernels"
version = "0.1.0"
description = "Fused softmax and RMSNorm kernels written in Triton from scratch, benchmarked against PyTorch baselines, with a step-by-step walkthrough"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/fusedkernels"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
